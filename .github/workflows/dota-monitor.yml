name: Dota 2 Match Monitor

on:
  schedule:
    - cron: "*/3 14-18 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "Bypass GMT+7 time window"
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  monitor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run monitor
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          DOTA_ACCOUNT_ID: "1088417288"
          FORCE_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.force }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
        run: python monitor.py

      - name: Commit state
        if: env.STATE_CHANGED == 'true'
        run: |
          git config user.name "dota-monitor[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add last_match.json
          git diff --staged --quiet || git commit -m "[skip ci] Update last_match_id"
          git push
