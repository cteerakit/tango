name: Dota 2 Match Monitor

on:
  schedule:
    # Every 5 min (GitHub minimum). monitor.py enforces 21:00–02:00 GMT+7.
    # Hour-limited cron (14-18 UTC) is unreliable on GitHub's scheduler.
    - cron: "*/5 * * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "Bypass GMT+7 time window"
        type: boolean
        default: true

permissions:
  contents: write

# Avoid overlapping runs racing on last_match.json push
concurrency:
  group: dota-monitor-${{ github.ref }}
  cancel-in-progress: true

jobs:
  monitor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Log schedule time
        run: |
          echo "Event: ${{ github.event_name }}"
          echo "UTC:  $(date -u '+%Y-%m-%d %H:%M:%S')"
          python -c "from datetime import datetime, timedelta, timezone; z=timezone(timedelta(hours=7)); print('GMT+7:', datetime.now(z).strftime('%Y-%m-%d %H:%M:%S'))"

      - name: Run monitor
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          DOTA_ACCOUNT_ID: "1088417288"
          FORCE_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.force }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
        run: python monitor.py

      - name: Commit state
        if: env.STATE_CHANGED == 'true'
        run: |
          git config user.name "dota-monitor[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add last_match.json
          if git diff --staged --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "[skip ci] Update last_match_id"
          branch="${{ github.ref_name }}"
          for attempt in 1 2 3 4 5; do
            git pull --rebase origin "$branch"
            if git push origin "HEAD:$branch"; then
              echo "Pushed state update."
              exit 0
            fi
            echo "Push rejected, retrying ($attempt/5)..."
            sleep $((attempt * 3))
          done
          echo "Failed to push after retries."
          exit 1
